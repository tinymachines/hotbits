<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="atomicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.6" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="40" stroke="#06b6d4" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.8"/>

  <!-- Middle ring -->
  <circle cx="50" cy="50" r="28" stroke="#9333ea" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.7"/>

  <!-- Inner ring -->
  <circle cx="50" cy="50" r="16" stroke="#f59e0b" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.9"/>

  <!-- Core -->
  <circle cx="50" cy="50" r="8" fill="url(#atomicGlow)" filter="url(#glow)"/>

  <!-- Electron paths -->
  <ellipse cx="50" cy="50" rx="35" ry="12" stroke="#22d3ee" stroke-width="1" fill="none"
           transform="rotate(45 50 50)" opacity="0.6"/>
  <ellipse cx="50" cy="50" rx="35" ry="12" stroke="#22d3ee" stroke-width="1" fill="none"
           transform="rotate(-45 50 50)" opacity="0.6"/>
</svg>